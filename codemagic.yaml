workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 30

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pop.touchgrass
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build
        script: |
          xcodebuild build \
            -project TouchGrass.xcodeproj \
            -scheme TouchGrass \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="iPhone Distribution"

      - name: Archive
        script: |
          xcodebuild archive \
            -project TouchGrass.xcodeproj \
            -scheme TouchGrass \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/TouchGrass.xcarchive \
            CODE_SIGN_IDENTITY="iPhone Distribution"

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/TouchGrass.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist

    artifacts:
      - build/ipa/*.ipa
      - build/TouchGrass.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
