workflows:
  ios-build:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 30

    integrations:
      app_store_connect: CodeMagic

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Debug and save API key
        script: |
          # Check if the variable is a file path or content
          echo "=== Variable starts with ==="
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | head -c 100
          echo ""
          echo "=== Is it a file path? ==="
          if [ -f "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "YES - it's a file path: $APP_STORE_CONNECT_PRIVATE_KEY"
            cp "$APP_STORE_CONNECT_PRIVATE_KEY" /tmp/AuthKey.p8
          else
            echo "NO - it's key content"
            # Use cat with heredoc to preserve exact content
            cat > /tmp/AuthKey.p8 << KEYEOF
          $APP_STORE_CONNECT_PRIVATE_KEY
          KEYEOF
          fi
          echo "=== Key file info ==="
          ls -la /tmp/AuthKey.p8
          wc -l /tmp/AuthKey.p8
          head -1 /tmp/AuthKey.p8
          tail -1 /tmp/AuthKey.p8
          echo "=== Key ID: $APP_STORE_CONNECT_KEY_IDENTIFIER ==="
          echo "=== Issuer ID: $APP_STORE_CONNECT_ISSUER_ID ==="

      - name: Archive
        script: |
          xcodebuild archive \
            -project TouchGrass.xcodeproj \
            -scheme TouchGrass \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/TouchGrass.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=QL8TU9W7QA

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/TouchGrass.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

    artifacts:
      - build/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
