workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 30

    integrations:
      app_store_connect: CodeMagic

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main

    scripts:
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "com.pop.touchgrass" \
            --type IOS_APP_DEVELOPMENT \
            --create
          app-store-connect fetch-signing-files "com.pop.touchgrass.monitor" \
            --type IOS_APP_DEVELOPMENT \
            --create
          app-store-connect fetch-signing-files "com.pop.touchgrass.widgets" \
            --type IOS_APP_DEVELOPMENT \
            --create

      - name: Set up keychain
        script: |
          keychain initialize
          app-store-connect certificates list \
            --type IOS_DEVELOPMENT \
            --save || \
          app-store-connect certificates create \
            --type IOS_DEVELOPMENT \
            --save
          keychain add-certificates

      - name: Apply profiles to Xcode
        script: xcode-project use-profiles

      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build
        script: |
          xcodebuild build \
            -project TouchGrass.xcodeproj \
            -scheme TouchGrass \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            | xcpretty
