workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 30

    integrations:
      app_store_connect: CodeMagic

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main

    scripts:
      - name: Set up code signing
        script: |
          # Generate a fresh RSA private key
          openssl genrsa -out /tmp/cert_key.pem 2048

          # Initialize keychain
          keychain initialize

          # Fetch/create profiles and certificates using the generated key
          app-store-connect fetch-signing-files "com.pop.touchgrass" \
            --type IOS_APP_DEVELOPMENT \
            --create \
            --certificate-key /tmp/cert_key.pem
          app-store-connect fetch-signing-files "com.pop.touchgrass.monitor" \
            --type IOS_APP_DEVELOPMENT \
            --create \
            --certificate-key /tmp/cert_key.pem
          app-store-connect fetch-signing-files "com.pop.touchgrass.widgets" \
            --type IOS_APP_DEVELOPMENT \
            --create \
            --certificate-key /tmp/cert_key.pem

          # Add certs to keychain and apply
          keychain add-certificates
          xcode-project use-profiles

      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build
        script: |
          xcodebuild build \
            -project TouchGrass.xcodeproj \
            -scheme TouchGrass \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            | xcpretty
