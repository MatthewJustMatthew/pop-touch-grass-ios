workflows:
  ios-build:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 30

    integrations:
      app_store_connect: CodeMagic

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Set up code signing
        script: |
          # Generate a fresh RSA private key
          openssl genrsa -out /tmp/cert_key.pem 2048

          # Initialize keychain
          keychain initialize

          # Fetch/create App Store profiles and certificates
          app-store-connect fetch-signing-files "com.pop.touchgrass" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key /tmp/cert_key.pem
          app-store-connect fetch-signing-files "com.pop.touchgrass.monitor" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key /tmp/cert_key.pem
          app-store-connect fetch-signing-files "com.pop.touchgrass.widgets" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key /tmp/cert_key.pem

          # Add certs to keychain
          keychain add-certificates

          # Apply profiles to the generated Xcode project
          xcode-project use-profiles --project TouchGrass.xcodeproj

          # Debug: verify profiles were applied
          echo "=== Checking signing settings ==="
          xcodebuild -project TouchGrass.xcodeproj -scheme TouchGrass -showBuildSettings | grep -E "PROVISIONING_PROFILE|CODE_SIGN|DEVELOPMENT_TEAM" | head -20

      - name: Archive
        script: |
          xcodebuild archive \
            -project TouchGrass.xcodeproj \
            -scheme TouchGrass \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/TouchGrass.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=QL8TU9W7QA

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/TouchGrass.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist

    artifacts:
      - build/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
