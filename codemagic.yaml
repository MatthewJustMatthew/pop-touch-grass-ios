workflows:
  ios-build:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 30

    integrations:
      app_store_connect: CodeMagic

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Debug and save API key
        script: |
          echo "=== Checking variable type ==="
          if [ -f "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "It's a FILE PATH: $APP_STORE_CONNECT_PRIVATE_KEY"
            cp "$APP_STORE_CONNECT_PRIVATE_KEY" /tmp/AuthKey.p8
          else
            echo "It's CONTENT, length: ${#APP_STORE_CONNECT_PRIVATE_KEY} chars"
            printenv APP_STORE_CONNECT_PRIVATE_KEY > /tmp/AuthKey.p8
          fi
          echo "=== /tmp/AuthKey.p8 ==="
          ls -la /tmp/AuthKey.p8
          wc -l < /tmp/AuthKey.p8
          head -1 /tmp/AuthKey.p8
          tail -1 /tmp/AuthKey.p8
          echo "=== Also searching for any .p8 files ==="
          find /tmp /Users/builder -name "*.p8" 2>/dev/null || true
          echo "=== Key ID: $APP_STORE_CONNECT_KEY_IDENTIFIER ==="
          echo "=== Issuer: $APP_STORE_CONNECT_ISSUER_ID ==="

      - name: Archive
        script: |
          xcodebuild archive \
            -project TouchGrass.xcodeproj \
            -scheme TouchGrass \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/TouchGrass.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=QL8TU9W7QA

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/TouchGrass.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

    artifacts:
      - build/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
