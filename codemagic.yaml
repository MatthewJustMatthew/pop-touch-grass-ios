workflows:
  ios-build:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 30

    integrations:
      app_store_connect: CodeMagic

    environment:
      groups:
        - github_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pop.touchgrass
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main

    scripts:
      - name: Check GitHub token
        script: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "GITHUB_TOKEN is not set"
            exit 1
          fi
          echo "GITHUB_TOKEN is set"

      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Archive
        script: |
          # Extract actual file path from @file: prefix
          KEY_PATH="${APP_STORE_CONNECT_PRIVATE_KEY#@file:}"
          echo "Using key at: $KEY_PATH"

          xcodebuild archive \
            -project TouchGrass.xcodeproj \
            -scheme TouchGrass \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/TouchGrass.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=QL8TU9W7QA

      - name: Export IPA
        script: |
          KEY_PATH="${APP_STORE_CONNECT_PRIVATE_KEY#@file:}"

          xcodebuild -exportArchive \
            -archivePath build/TouchGrass.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

    artifacts:
      - build/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
